<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FieldSense - Sports Performance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0d1218;--sf:#151c25;--sf2:#1c2530;--ln:#283342;--tx:#e8eef5;--mu:#8795a8;--ac:#4cc3f5;--hr:#ff6b7a;--ok:#3ecf8e;--wn:#f5b942;--er:#ff5d6c;--r:10px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;letter-spacing:.2px}
h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.02;font-weight:700}
h2{font-size:1.9rem;margin-bottom:.6rem}h3{font-size:1.2rem}
a{color:var(--ac);text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:#06202c;border:0;border-radius:8px;padding:.6rem 1.1rem;font-weight:600;cursor:pointer;display:inline-block}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.warn{background:var(--wn)}.btn.danger{background:var(--er);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:1rem}
.grid{display:grid;gap:.9rem}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.mu{color:var(--mu)}.sm{font-size:.85rem}
.mc{display:flex;flex-direction:column;gap:.1rem}
.mc .ml{color:var(--mu);font-size:.85rem}
.mc b{font:600 2.3rem/1.1 "Barlow Condensed";font-variant-numeric:tabular-nums}
.mc i{font-style:normal;color:var(--mu);font-size:.8rem}
.badge{display:inline-flex;align-items:center;gap:.4rem;border-radius:99px;padding:.15rem .7rem;font-size:.8rem;font-weight:600;background:var(--sf2);border:1px solid var(--ln)}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mu)}
.badge.ok:before{background:var(--ok)}.badge.bad:before{background:var(--er)}.badge.demo{color:var(--wn);border-color:var(--wn)}.badge.demo:before{background:var(--wn)}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:.2rem}
input,select{width:100%;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:.55rem .7rem}
.form{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.full{grid-column:1/-1}
/* shell */
.shell{display:flex;min-height:100%}
.side{width:230px;background:var(--sf);border-right:1px solid var(--ln);padding:1rem;display:flex;flex-direction:column;gap:.3rem;position:sticky;top:0;height:100vh}
.side a{color:var(--mu);padding:.55rem .7rem;border-radius:8px;font-weight:500}
.side a.on,.side a:hover{background:var(--sf2);color:var(--tx)}
.logo{font:700 1.5rem "Barlow Condensed";color:var(--tx);margin-bottom:1rem}.logo b{color:var(--ac)}
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.2rem;border-bottom:1px solid var(--ln);justify-content:space-between}
#view{padding:1.2rem;display:grid;gap:1rem;max-width:1200px}
.burger{display:none}
@media(max-width:820px){.side{position:fixed;z-index:30;left:-250px;transition:left .2s}.side.open{left:0}.burger{display:inline-block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.chartbox{position:relative;height:210px}
#map,.minimap{height:340px;border-radius:var(--r);border:1px solid var(--ln)}.minimap{height:240px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sess{cursor:pointer}.sess:hover{border-color:var(--ac)}
.sess dl{display:grid;grid-template-columns:repeat(2,1fr);gap:.3rem .8rem;margin-top:.6rem}
.sess dt{color:var(--mu);font-size:.78rem}.sess dd{margin:0;font-weight:600}
.banner{padding:.6rem .9rem;border-radius:8px;background:#3a2a10;border:1px solid var(--wn);color:var(--wn)}
.err{background:#3a1519;border-color:var(--er);color:#ffb3ba}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--mu)}
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:1rem}
.sheet{background:var(--bg);border:1px solid var(--ln);border-radius:var(--r);width:min(860px,100%);padding:1.2rem;display:grid;gap:1rem}
#toasts{position:fixed;right:1rem;bottom:1rem;z-index:60;display:grid;gap:.5rem}
.toast{background:var(--sf2);border:1px solid var(--ln);border-left:4px solid var(--ac);padding:.6rem .9rem;border-radius:8px;max-width:320px}
.toast.err{border-left-color:var(--er)}
.seg button{background:var(--sf2);border:1px solid var(--ln);padding:.35rem .8rem;cursor:pointer}
.seg button.on{background:var(--ac);color:#06202c;font-weight:600}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.scroll{overflow-x:auto}
pre{background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:.8rem;overflow:auto;font-size:.82rem}
/* landing */
.wrap{max-width:1080px;margin:auto;padding:0 1.2rem}
.nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 0}
.hero{padding:4rem 0 2.5rem;display:grid;gap:1.4rem;max-width:760px}
.flow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.flow span{background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:.3rem .7rem;font-weight:500}.flow em{color:var(--ac);font-style:normal}
section.l{padding:2.2rem 0;border-top:1px solid var(--ln)}
.auth{max-width:560px;margin:2rem auto;padding:0 1rem}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ===== Config: set your backend URL here ===== */
const API = window.API_BASE || "http://localhost:8000";
 
/* ===== helpers ===== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = (v, d = 1) => v == null || isNaN(v) ? "--" : Number(v).toFixed(d);
const dur = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0"); };
const dt = iso => new Date(iso).toLocaleString([], {dateStyle: "medium", timeStyle: "short"});
let token = localStorage.getItem("tk"), me = null, shellOn = false, viewCharts = [], pref = {src: localStorage.getItem("src") || "device"};
const live = {session: null, p: null, last: 0, lastTs: null, t: [], s: {hr: [], speed: [], temp: [], hum: [], dist: [], cal: []}, route: []};
let ws = null, poll = null, devTimer = null;
 
function toast(msg, type = "") { const d = document.createElement("div"); d.className = "toast " + type; d.textContent = msg; $("#toasts").append(d); setTimeout(() => d.remove(), 4500); }
const badge = (t, c = "") => `<span class="badge ${c}">${t}</span>`;
const loading = () => `<div class="empty">Loading...</div>`;
const errState = (m, retry = "route()") => `<div class="card banner err">${esc(m)} <button class="btn ghost" onclick="${retry}">Retry</button></div>`;
 
async function api(path, o = {}) {
  let r;
  try {
    r = await fetch(API + path, {method: o.method || "GET", headers: {"Content-Type": "application/json", ...(token ? {Authorization: "Bearer " + token} : {})}, body: o.body ? JSON.stringify(o.body) : undefined});
  } catch { throw new Error("Backend unreachable. Check that the server is running at " + API); }
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout("Session expired. Please log in again."); throw new Error("Session expired"); }
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Request failed (" + r.status + "). Check the entered values.");
  return d;
}
function logout(msg) { token = null; me = null; localStorage.removeItem("tk"); stopLink(); live.session = null; shellOn = false; clearInterval(devTimer); if (msg) toast(msg, "err"); location.hash = "#/login"; }
 
/* ===== charts ===== */
Chart.defaults.color = "#8795a8"; Chart.defaults.borderColor = "#283342"; Chart.defaults.font.family = "Barlow";
function mk(canvas, type, labels, data, color, label) {
  const c = new Chart(canvas, {type, data: {labels, datasets: [{label, data, borderColor: color, backgroundColor: color + "99", tension: .3, pointRadius: 0, borderWidth: 2, spanGaps: true}]},
    options: {responsive: true, maintainAspectRatio: false, animation: false, plugins: {legend: {display: false}, title: {display: true, text: label, color: "#e8eef5"}}, scales: {x: {ticks: {maxTicksLimit: 6}}}}});
  viewCharts.push(c); return c;
}
const killCharts = () => { viewCharts.forEach(c => c.destroy()); viewCharts = []; };
const KEYS = {hr: "heart_rate", speed: "speed", temp: "temperature", hum: "humidity", dist: "distance_km", cal: "calories"};
const CH = {hr: ["Heart rate (BPM)", "#ff6b7a"], speed: ["Speed (km/h)", "#4cc3f5"], temp: ["Temperature (°C)", "#f5b942"], hum: ["Humidity (%)", "#7aa7ff"], dist: ["Distance (km)", "#3ecf8e"], cal: ["Estimated calories (kcal)", "#c58bff"]};
function liveCharts(keys) { keys.forEach(k => { const el = $(`canvas[data-k="${k}"]`); if (el) mk(el, "line", live.t, live.s[k], CH[k][1], CH[k][0]); }); }
 
/* ===== live data ===== */
function feed(p) {
  live.t.push(dur(p.elapsed_s)); for (const k in KEYS) live.s[k].push(p[KEYS[k]] ?? null);
  if (p.latitude != null && p.longitude != null) live.route.push([p.latitude, p.longitude]);
  if (live.t.length > 240) { live.t.shift(); for (const k in KEYS) live.s[k].shift(); }
}
const setM = (k, v) => $$(`[data-m="${k}"]`).forEach(e => e.textContent = v);
function paint(p) {
  setM("hr", nf(p.heart_rate, 0)); setM("temp", nf(p.temperature)); setM("hum", nf(p.humidity)); setM("speed", nf(p.speed));
  setM("dist", nf(p.distance_km, 2)); setM("cal", nf(p.calories, 0)); setM("dur", dur(p.elapsed_s)); setM("avg", nf(p.avg_speed));
  setM("lat", nf(p.latitude, 5)); setM("lon", nf(p.longitude, 5));
  const h = p.heart_rate; setM("hrs", h == null ? "No heart-rate signal" : h < 100 ? "Light" : h < 140 ? "Moderate" : h < 170 ? "Hard" : "Peak");
}
function onData(p) {
  if (!p || !p.ts || p.ts === live.lastTs) return;
  live.lastTs = p.ts; live.last = Date.now(); live.p = p; feed(p); paint(p);
  viewCharts.forEach(c => c.update("none")); mapUpdate(p); watch();
}
function watch() {
  const s = live.session; if (!s) return;
  const stale = Date.now() - live.last > 8000, el = $("#warn");
  if (el) { el.hidden = !(stale || (live.p && !live.p.gps_fix)); el.textContent = stale ? (s.source === "demo" ? "Demo stream stalled." : "ESP32 is not connected.") : "Waiting for GPS signal..."; }
  setM("gps", live.p && live.p.gps_fix ? "GPS fix" : "Waiting for GPS signal...");
}
function stopLink() { clearInterval(poll); if (ws) { ws.onclose = null; ws.close(); ws = null; } }
function connect() {
  stopLink(); if (!live.session) return; const sid = live.session.id;
  ws = new WebSocket(API.replace(/^http/, "ws") + `/ws/live/${sid}?token=${token}`);
  ws.onopen = () => { clearInterval(poll); setM("link", "WebSocket"); };
  ws.onmessage = e => onData(JSON.parse(e.data));
  ws.onclose = () => {
    if (!live.session || live.session.id !== sid) return;
    setM("link", "Polling (WebSocket unavailable)");
    clearInterval(poll); poll = setInterval(async () => { try { onData(await api(`/api/session/${sid}/live`)); } catch {} }, 2000);
    setTimeout(() => { if (live.session && live.session.id === sid && (!ws || ws.readyState > 1)) connect(); }, 5000);
  };
}
function resetLive() { live.p = null; live.lastTs = null; live.last = Date.now(); live.t.length = 0; Object.values(live.s).forEach(a => a.length = 0); live.route.length = 0; }
async function loadActive() {
  const a = await api("/api/session/active"); resetLive(); live.session = a.session;
  if (a.session) {
    try { const d = await api("/api/session/" + a.session.id); d.readings.forEach(feed); } catch {}
    connect(); if (a.live) onData(a.live);
  }
}
async function act(a, body) {
  try {
    const s = await api("/api/session/" + a, {method: "POST", body});
    if (a === "start") { resetLive(); live.session = s; connect(); toast(s.source === "demo" ? "Demo session started" : "Session started"); }
    else if (a === "stop") { live.session = null; stopLink(); toast("Session saved"); renderCtl(); openSession(s.id); return; }
    else live.session = s;
    renderCtl();
  } catch (e) { toast(e.message, "err"); }
}
function renderCtl() {
  const el = $("#ctl"); if (!el) return; const s = live.session;
  el.innerHTML = !s ? `<label class="row" style="margin:0"><input type="checkbox" id="demo" style="width:auto"> Demo mode (simulated data)</label><button class="btn" onclick="act('start',{demo:$('#demo').checked})">Start session</button>`
    : `${s.source === "demo" ? badge("DEMO MODE", "demo") : badge("Live device", "ok")}${badge(s.status === "paused" ? "Paused" : "Recording", s.status === "paused" ? "" : "ok")}
       ${s.status === "paused" ? `<button class="btn" onclick="act('resume')">Resume</button>` : `<button class="btn warn" onclick="act('pause')">Pause</button>`}
       <button class="btn danger" onclick="act('stop')">Stop &amp; save</button>`;
}
 
/* ===== map ===== */
let map = null, line = null, dot = null;
function mapInit(id) {
  map = L.map(id).setView(live.route.at(-1) || [30.7046, 76.7179], 16);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "&copy; OpenStreetMap"}).addTo(map);
  line = L.polyline(live.route, {color: "#4cc3f5", weight: 4}).addTo(map); dot = null;
  if (live.route.length) { dot = L.circleMarker(live.route.at(-1), {radius: 8, color: "#fff", fillColor: "#ff6b7a", fillOpacity: 1}).addTo(map); }
}
function mapUpdate(p) {
  if (!map || !$("#map") || p.latitude == null) return; const ll = [p.latitude, p.longitude];
  line.setLatLngs(live.route); if (!dot) dot = L.circleMarker(ll, {radius: 8, color: "#fff", fillColor: "#ff6b7a", fillOpacity: 1}).addTo(map); else dot.setLatLng(ll);
  map.panTo(ll, {animate: false});
}
 
/* ===== views ===== */
const mcard = (k, l, u) => `<div class="card mc"><span class="ml">${l}</span><b data-m="${k}">--</b><i>${u}</i></div>`;
const noSession = `<div class="card empty">No active session. <a href="#/app/live">Start a session</a> to see live data.</div>`;
const V = {};
V.dashboard = async () => {
  $("#view").innerHTML = `<h2>Dashboard</h2><div id="warn" class="banner" hidden></div>
  <div class="grid g4">${mcard("hr", "Heart rate", "BPM")}${mcard("temp", "Temperature", "°C")}${mcard("hum", "Humidity", "%")}${mcard("speed", "Speed", "KM/H")}
  ${mcard("dist", "Distance", "KM")}${mcard("cal", "Estimated calories", "KCAL")}${mcard("dur", "Session duration", "")}${mcard("score", "Last session score", "/ 100")}</div>
  <div class="grid g2"><div class="card chartbox"><canvas data-k="hr"></canvas></div><div class="card chartbox"><canvas data-k="speed"></canvas></div></div>
  ${live.session ? "" : noSession}`;
  liveCharts(["hr", "speed"]); if (live.p) { paint(live.p); watch(); }
  try { const h = await api("/api/session/history?limit=1&source=" + pref.src); setM("score", h[0] ? h[0].ai.score : "--"); } catch {}
};
V.live = async () => {
  $("#view").innerHTML = `<h2>Live tracking</h2><div class="card row" id="ctl"></div><div id="warn" class="banner" hidden></div>
  <div class="grid g2"><div id="map"></div><div class="grid g4" style="align-content:start">${mcard("hr", "Heart rate", "BPM")}${mcard("temp", "Temperature", "°C")}${mcard("hum", "Humidity", "%")}${mcard("speed", "Current speed", "KM/H")}
  ${mcard("avg", "Average speed", "KM/H")}${mcard("dist", "Distance", "KM")}${mcard("dur", "Duration", "")}${mcard("cal", "Estimated calories", "KCAL")}</div></div>
  <div class="card sm mu">MAX30102: <b data-m="hrs" style="color:var(--tx)">--</b> &nbsp; GPS: <b data-m="gps" style="color:var(--tx)">Waiting for GPS signal...</b> &nbsp; Lat <b data-m="lat" style="color:var(--tx)">--</b> Lon <b data-m="lon" style="color:var(--tx)">--</b> &nbsp; Link: <b data-m="link" style="color:var(--tx)">--</b><br>Calories are estimates from weight, time and speed, not medical measurements.</div>
  <div class="grid g2">${Object.keys(CH).map(k => `<div class="card chartbox"><canvas data-k="${k}"></canvas></div>`).join("")}</div>`;
  renderCtl(); liveCharts(Object.keys(CH)); mapInit("map"); if (live.p) { paint(live.p); watch(); }
};
const srcSel = fn => `<select id="src" style="width:auto" onchange="pref.src=this.value;localStorage.setItem('src',this.value);${fn}()"><option value="device">Device data</option><option value="demo">Demo data</option><option value="all">All data</option></select>`;
V.history = async () => {
  $("#view").innerHTML = `<div class="row"><h2 style="margin:0">Session history</h2>${srcSel("V.history")}</div><div id="list">${loading()}</div>`; $("#src").value = pref.src;
  try {
    const rows = await api("/api/session/history?source=" + pref.src);
    $("#list").innerHTML = rows.length ? `<div class="grid g4">${rows.map(s => { const m = s.summary; return `<div class="card sess" tabindex="0" onclick="openSession('${s.id}')" onkeydown="if(event.key==='Enter')openSession('${s.id}')">
      <div class="row" style="justify-content:space-between"><b>${dt(s.started_at)}</b>${s.source === "demo" ? badge("DEMO", "demo") : ""}</div>
      <div class="num" style="font-size:2rem;color:var(--ac)">${s.ai.score}<span class="mu sm"> / 100 · ${s.ai.category}</span></div>
      <dl><div><dt>Duration</dt><dd>${dur(m.duration_s)}</dd></div><div><dt>Distance</dt><dd>${nf(m.distance_km, 2)} km</dd></div><div><dt>Avg / max HR</dt><dd>${nf(m.avg_hr, 0)} / ${nf(m.max_hr, 0)}</dd></div>
      <div><dt>Avg speed</dt><dd>${nf(m.avg_speed)} km/h</dd></div><div><dt>Est. calories</dt><dd>${m.calories} kcal</dd></div></dl></div>`; }).join("")}</div>`
      : `<div class="card empty">No sessions yet. Start your first training session.<br><br><a class="btn" href="#/app/live">Start session</a></div>`;
  } catch (e) { $("#list").innerHTML = errState(e.message, "V.history()"); }
};
async function openSession(id) {
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="sheet">${loading()}</div>`; m.onclick = e => { if (e.target === m) closeModal(); }; document.body.append(m);
  try {
    const s = await api("/api/session/" + id), x = s.summary, ai = s.ai, rs = s.readings, lab = rs.map(r => dur(r.elapsed_s));
    m.firstChild.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Session · ${dt(s.started_at)} ${s.source === "demo" ? badge("DEMO", "demo") : ""}</h2><button class="btn ghost" onclick="closeModal()">Close</button></div>
    <div class="card"><div class="num" style="font-size:2.6rem;color:var(--ac)">${ai.score} / 100 <span class="sm mu">${ai.category}</span></div><ul style="padding-left:1.1rem;margin-top:.4rem">${ai.insights.map(i => `<li>${esc(i)}</li>`).join("")}</ul><p class="sm mu" style="margin-top:.5rem">${esc(ai.disclaimer)} Model: ${esc(ai.model)}</p></div>
    <div class="grid g4">${[["Duration", dur(x.duration_s)], ["Distance", nf(x.distance_km, 2) + " km"], ["Avg speed", nf(x.avg_speed) + " km/h"], ["Max speed", nf(x.max_speed) + " km/h"], ["Avg HR", nf(x.avg_hr, 0)], ["Max HR", nf(x.max_hr, 0)],
      ["Temp avg/min/max", x.temperature ? [x.temperature.avg, x.temperature.min, x.temperature.max].join(" / ") : "--"], ["Humidity avg/min/max", x.humidity ? [x.humidity.avg, x.humidity.min, x.humidity.max].join(" / ") : "--"], ["Est. calories", x.calories + " kcal"]]
      .map(([a, b]) => `<div class="card"><div class="mu sm">${a}</div><b class="num" style="font-size:1.4rem">${b}</b></div>`).join("")}</div>
    <div class="grid g2"><div class="card chartbox"><canvas id="mh"></canvas></div><div class="card chartbox"><canvas id="ms"></canvas></div></div><div id="mm" class="minimap"></div>`;
    mk($("#mh"), "line", lab, rs.map(r => r.heart_rate), CH.hr[1], CH.hr[0]); mk($("#ms"), "line", lab, rs.map(r => r.speed), CH.speed[1], CH.speed[0]);
    const pts = rs.filter(r => r.latitude != null).map(r => [r.latitude, r.longitude]);
    if (pts.length > 1) { const mm = L.map("mm"); L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "&copy; OpenStreetMap"}).addTo(mm); mm.fitBounds(L.polyline(pts, {color: "#4cc3f5"}).addTo(mm).getBounds()); modalMap = mm; }
    else $("#mm").outerHTML = `<div class="card empty">No GPS route recorded for this session.</div>`;
